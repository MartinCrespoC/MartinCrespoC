name: Render animated particle header

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/web/**
      - scripts/render-header.mjs
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: main-committer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Render animated header
        run: node scripts/render-header.mjs

      - name: Publish to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live || true
          if git rev-parse --verify origin/live >/dev/null 2>&1; then
            git checkout live
            git reset --hard origin/live
          else
            git checkout --orphan live
            git rm -rf .
          fi
          cp assets/header.webp header.webp
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: re-render animated particle header"
          for i in 1 2 3 4; do
            git fetch origin live || true
            if git rev-parse --verify origin/live >/dev/null 2>&1; then
              git pull --rebase origin live || true
            fi
            git push origin live && exit 0
            sleep 3
          done
          exit 1
