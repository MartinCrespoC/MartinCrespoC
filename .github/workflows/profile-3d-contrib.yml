name: Build 3D contribution graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-committer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/artifacts
          cp profile-3d-contrib/*.svg /tmp/artifacts/
          git fetch origin live
          git worktree add --detach /tmp/livewt origin/live
          cd /tmp/livewt
          git switch -C live
          mkdir -p 3d
          cp /tmp/artifacts/*.svg 3d/
          git add 3d
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update 3d contribution graph"
          for i in 1 2 3 4; do
            git fetch origin live || true
            git pull --rebase origin live || true
            git push origin live && exit 0
            sleep 3
          done
          exit 1
