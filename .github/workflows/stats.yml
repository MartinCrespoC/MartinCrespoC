name: Regenerate profile metrics

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-stats.js

permissions:
  contents: write

concurrency:
  group: main-committer
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate metric cards
        run: node scripts/generate-stats.js
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publish to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live || true
          if git rev-parse --verify origin/live >/dev/null 2>&1; then
            git checkout live
            git reset --hard origin/live
          else
            git checkout --orphan live
            git rm -rf .
          fi
          mkdir -p stats
          cp assets/generated/*.svg stats/
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh live metrics"
          for i in 1 2 3 4; do
            git fetch origin live || true
            if git rev-parse --verify origin/live >/dev/null 2>&1; then
              git pull --rebase origin live || true
            fi
            git push origin live && exit 0
            sleep 3
          done
          exit 1
