<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Juan Martin Crespo - IT Strategy x GenAI Innovation">
  <defs>
    <radialGradient id="neb-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="hairline" gradientUnits="userSpaceOnUse" x1="360" y1="232" x2="840" y2="232">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#0B0E2A"/>

  <ellipse cx="215" cy="70" rx="330" ry="165" fill="url(#neb-violet)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="990" cy="235" rx="350" ry="175" fill="url(#neb-cyan)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="630" cy="310" rx="270" ry="120" fill="url(#neb-magenta)" filter="url(#soft)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <rect width="1200" height="300" fill="url(#grid)"/>

<!-- ::PARTICLES:: -->

  <g stroke="#00E5FF" stroke-width="2" opacity="0.65" fill="none">
    <path d="M 18 36 V 18 H 36"/>
    <path d="M 1182 36 V 18 H 1164"/>
    <path d="M 18 264 V 282 H 36"/>
    <path d="M 1182 264 V 282 H 1164"/>
  </g>

  <g transform="translate(600,56)">
    <rect x="-88" y="-16" rx="16" ry="16" width="176" height="32" fill="#161B40" fill-opacity="0.55" stroke="#00E5FF" stroke-opacity="0.35"/>
    <circle cx="-70" cy="0" r="4" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="4.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="4" fill="#00E5FF">SYSTEM ONLINE</text>
  </g>

  <text x="600" y="162" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="3" fill="url(#name-grad)" filter="url(#text-glow)">JUAN MARTIN CRESPO</text>

  <text x="600" y="200" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="9" fill="#00E5FF" opacity="0.92">IT STRATEGY <tspan fill="#A0ABC0" opacity="0.6">x</tspan> GENAI INNOVATION</text>

  <line x1="360" y1="232" x2="840" y2="232" stroke="url(#hairline)" stroke-width="1.5"/>
  <rect x="594" y="226" width="12" height="12" transform="rotate(45 600 232)" fill="#00E5FF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
